# ProxyCore Configuration
# This file is copied to plugins/ProxyCore/config.yml on first run

# Server to send players with /hub command
target-server: "lobby"

# MOTD Configuration
motd:
    enabled: true
    # Enable maintenance mode (displays maintenance message in server list)
    maintenance: false
    # Lines shown when maintenance is enabled (supports MiniMessage)
    maintenance-lines:
        - "<yellow>⚠ <red>El Servidor esta en mantenimiento!</red> ⚠</yellow>"
        - "<gray>Regresa en un rato!</gray>"
    # Lines shown in the server list (supports MiniMessage)
    players:
        - "<gradient:gold:yellow>✦ Dopamine Network ✦</gradient>"
        - "<green>Join us at play.dopamine.xyz</green>"

# Announcements Configuration
announcements:
    # Enable automatic announcements in chat
    enabled: false
    # Time between announcements in seconds
    interval-seconds: 300
    # Messages to broadcast (supports MiniMessage)
    messages:
        - "<gradient:aqua:light_purple>★ Welcome to Dopamine Network!</gradient>"
        - "<yellow>⚡ Use /hub to return to the lobby</yellow>"

# Chat Configuration
chat:
    # Broadcast command format (placeholder: {message})
    broadcast:
        format: "<dark_gray>[</dark_gray><red>Broadcast</red><dark_gray>]</dark_gray> <white>{message}</white>"
    # Staff chat format (placeholders: {player}, {message})
    staff:
        format: "<dark_gray>[</dark_gray><red>🛡 Staff</red><dark_gray>]</dark_gray> <dark_red>{player}</dark_red><dark_gray>:</dark_gray> <white>{message}</white>"

# Resource Pack Configuration
resource-pack:
    enabled: false
    url: ""
    sha1: ""

# Command Blocker (strict whitelist)
# Any command a player runs that is NOT in this list is blocked in the proxy and never
# reaches the backend servers. Players with ProxyCore.commandblocker.bypass are exempt.
command-blocker:
    # Master switch. false = the blocker is completely disabled
    enabled: true
    # Allowed command names. Write the bare name, without slash and without arguments.
    # Namespaces are ignored, so "gamemode" also covers "/minecraft:gamemode creative",
    # "/GAMEMODE" and every plugin-namespaced variant of the same command.
    whitelist:
        - "lobby"
        - "server"
        - "hub"
        - "spawn"
        - "leave"
        - "server"
        - "msg"
        - "tell"
        - "w"
        - "r"
        - "reply"
        - "help"
        - "proxycore"
        - "login"
        - "register"
        - "changepassword"
    # Message sent to the player when a command is blocked (supports MiniMessage)
    # Placeholders: {player}, {command}, {server}
    deny-message: "<dark_gray>[</dark_gray><red>Blocked</red><dark_gray>]</dark_gray> <gray>You cannot use <white>{command}</white> on this network.</gray>"
    # Log every blocked attempt in the proxy console
    log-attempts: true
    # Console log format. Placeholders: {player}, {server}, {command}, {raw}
    log-format: "Blocked command: player={player}, server={server}, command={command}, raw={raw}"
    # Also hide blocked commands from tab-completion suggestions
    block-tab-complete: true
    # Never block commands registered on the proxy itself, even if they are missing from
    # the whitelist. Recommended: keeps admins from locking themselves out.
    always-allow-proxy-commands: true
